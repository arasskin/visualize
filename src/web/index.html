<!doctype html>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="/style.css">
<!-- No top bar. Regenerate is gone because a watcher notices edits on its
     own; Fit is the `0` key; and what is left -- the zoom level and what the
     server is doing -- is status, not furniture, so it floats over the graph
     and fades when there is nothing to say. -->
<div id="graph">{{GRAPH}}<div id="edgelabel"></div></div>
<div id="hud"><span id="zoom"></span><span id="status"></span></div>

<!-- The compose bar. Hidden until you type: start typing anywhere on the
     page and the keystroke lands here. The parentheses are PRINTED, not
     typed -- every line of the config is a call, so they are furniture
     rather than something to remember. -->
<div id="compose" class="shut">
  <div id="compose-line">
    <span class="paren">(</span><input id="compose-input" spellcheck="false"
      autocomplete="off" aria-label="add a config line"><span class="paren">)</span>
  </div>
  <!-- Why the line was refused, under the bar. Empty until something is. -->
  <p id="compose-fault" role="status" aria-live="polite"></p>
</div>

<!-- The help panel. Empty here: its content is the verb table from
     src/visualize/config.janet, rendered by app.js, because a list of verbs
     written out in HTML is a list that goes stale the first time one
     changes. -->
<button id="help-open" title="what the config can say" aria-label="help">?</button>
<!-- aria-label rather than aria-labelledby: there is no heading to point at,
     but a dialog still has to announce itself as something. -->
<div id="help" class="shut" role="dialog" aria-modal="true" aria-label="config verbs">
  <div id="help-verbs"></div>
</div>

<div id="config" class="panel shut">
  <div id="bar" class="bar" title="click to open, drag to move">
    <span class="name">{{CONFIG_NAME}}</span>
  </div>
  <div id="body" class="panel-body">
    <div id="lines"></div>
    <div id="problems"></div>
  </div>
  <div id="grip" class="grip" title="drag to resize"></div>
</div>
<script>
// The file the page was rendered from, handed over at load so the editor opens
// on the same lines the graph came from.
window.CONFIG_LINES = {{CONFIG_LINES}};
window.CONFIG_PROBLEMS = {{CONFIG_PROBLEMS}};
// The verbs, generated from the grammar. See config/docs.
window.CONFIG_DOCS = {{CONFIG_DOCS}};
// The secret the write endpoints require. Here rather than in a cookie so
// it dies with the tab and is never sent to another origin.
window.TOKEN = {{TOKEN}};
</script>
<script type="module" src="/app.js"></script>
