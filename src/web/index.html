<!doctype html>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="/style.css">
<!-- No top bar. Regenerate is gone because a watcher notices edits on its
     own; Fit is the `0` key; and what is left -- the zoom level and what the
     server is doing -- is status, not furniture, so it floats over the graph
     and fades when there is nothing to say. -->
<div id="graph">{{GRAPH}}<div id="edgelabel"></div></div>
<div id="hud"><span id="zoom"></span><span id="status"></span></div>

<div id="config" class="panel shut">
  <div id="bar" class="bar" title="click to open, drag to move">
    <span class="name">{{CONFIG_NAME}}</span>
  </div>
  <div id="body" class="panel-body">
    <div id="lines"></div>
    <div id="problems"></div>
  </div>
  <div id="grip" class="grip" title="drag to resize"></div>
</div>
<script>
// The file the page was rendered from, handed over at load so the editor opens
// on the same lines the graph came from.
window.CONFIG_LINES = {{CONFIG_LINES}};
window.CONFIG_PROBLEMS = {{CONFIG_PROBLEMS}};
// The secret the write endpoints require. Here rather than in a cookie so
// it dies with the tab and is never sent to another origin.
window.TOKEN = {{TOKEN}};
</script>
<script type="module" src="/app.js"></script>
