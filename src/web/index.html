<!doctype html>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="/style.css">
<!-- No top bar. Regenerate is gone because a watcher notices edits on its
     own; Fit is the `0` key; and what is left -- the zoom level and what the
     server is doing -- is status, not furniture, so it floats over the graph
     and fades when there is nothing to say. -->
<div id="graph">{{GRAPH}}<div id="edgelabel"></div></div>
<div id="hud"><span id="zoom"></span><span id="status"></span></div>

<!-- The compose bar. Hidden until you type: start typing anywhere on the
     page and the keystroke lands here. What you write is wrapped in
     parentheses on its way to the file -- every line of the config is a
     call, so they are not something to type. -->
<div id="compose" class="shut">
  <!-- The box is the bordered thing; the parens live INSIDE it, one at each
       end of the line. Printed, not typed -- every line of the config is a
       call, so they are the shape of what you are writing. -->
  <div id="compose-box">
    <span class="paren">(</span><input id="compose-input" spellcheck="false"
      autocomplete="off" aria-label="add a config line"><span class="paren">)</span>
  </div>
  <!-- Completions, ABOVE the bar: the graph is behind, and a list dropping
       down would cover the part you are looking at while you filter it. -->
  <ul id="compose-list" role="listbox" aria-label="completions"></ul>
  <!-- Why the line was refused, under the bar. Empty until something is. -->
  <p id="compose-fault" role="status" aria-live="polite"></p>
</div>

<!-- The search bar, at the top: the browser's own find cannot see into a
     drawing -- it matches text, but a node's name is scattered across
     <text> elements and finding it neither says where it is nor moves the
     view to it. Cmd-F opens this instead, and a hit gets an arrow drawn at
     it in the graph's own coordinates. -->
<div id="find" class="shut">
  <div id="find-box">
    <input id="find-input" spellcheck="false" autocomplete="off"
      placeholder="find a node" aria-label="find a node">
    <span id="find-count" aria-live="polite"></span>
  </div>
  <!-- Completions, BELOW this bar: it sits at the top of the screen, so the
       list drops away from the field rather than off the edge -- the mirror
       of the compose bar's, which opens upward from the bottom. -->
  <ul id="find-list" role="listbox" aria-label="node names"></ul>
</div>

<!-- The help panel. Empty here: its content is the verb table from
     src/visualize/config.janet, rendered by app.js, because a list of verbs
     written out in HTML is a list that goes stale the first time one
     changes. -->
<button id="help-open" title="what the config can say  (? or F1)" aria-label="help">?</button>
<!-- aria-label rather than aria-labelledby: there is no heading to point at,
     but a dialog still has to announce itself as something. -->
<div id="help" class="shut" role="dialog" aria-modal="true" aria-label="config verbs">
  <div id="help-verbs"></div>
</div>

<div id="config" class="panel shut">
  <div id="bar" class="bar" title="click to open, drag to move  (alt to toggle, hold alt to peek)">
    <span class="name">{{CONFIG_NAME}}</span>
  </div>
  <div id="body" class="panel-body">
    <div id="lines"></div>
    <div id="problems"></div>
  </div>
  <div id="grip" class="grip" title="drag to resize"></div>
</div>
<script>
// The file the page was rendered from, handed over at load so the editor opens
// on the same lines the graph came from.
window.CONFIG_LINES = {{CONFIG_LINES}};
window.CONFIG_PROBLEMS = {{CONFIG_PROBLEMS}};
// The verbs, generated from the grammar. See config/docs.
window.CONFIG_DOCS = {{CONFIG_DOCS}};
// The colours a config can name, for the editor to complete.
window.CONFIG_COLOURS = {{CONFIG_COLOURS}};
// The secret the write endpoints require. Here rather than in a cookie so
// it dies with the tab and is never sent to another origin.
window.TOKEN = {{TOKEN}};
</script>
<script type="module" src="/app.js"></script>
