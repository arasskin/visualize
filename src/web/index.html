<!doctype html>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<link rel="icon" href="{{FAVICON}}">

<script type="importmap">
{
  "imports": {
    "@wterm/dom": "/wterm-dom.js"
  }
}
</script>

<link rel="stylesheet" href="/wterm.css">
<link rel="stylesheet" href="/style.css">

<div id="graph">{{GRAPH}}<div id="edgelabel"></div></div>

<div id="compose" class="shut">

  <label id="compose-box" for="compose-input">
    <textarea id="compose-input" rows="1"
      spellcheck="false" autocomplete="off" autocapitalize="off"
      aria-label="add a config line"></textarea>
  </label>

  <ul id="compose-list" role="listbox" aria-label="completions"></ul>

  <p id="compose-fault" role="status" aria-live="polite"></p>
</div>

<div id="find" class="shut">
  <label id="find-box" for="find-input">
    <input id="find-input" spellcheck="false" autocomplete="off"
      placeholder="find a node" aria-label="find a node">
    <span id="find-count" aria-live="polite"></span>
  </label>

  <ul id="find-list" role="listbox" aria-label="node names"></ul>
</div>


<div id="help" class="shut" role="dialog" aria-modal="true" aria-label="config verbs">
  <div id="help-verbs"></div>
</div>

<template id="panel-template">
  <div class="panel shut">
    <div class="bar" title="click to open, drag to move (alt toggles the selected tab, hold to peek)">
      <span class="name"></span>
      <span class="label" contenteditable="plaintext-only" spellcheck="false" role="textbox" aria-label="note for this tab"></span>
      <span class="state"></span>
      <button class="tab-fade" type="button" title="keep pane at full opacity" aria-label="Keep pane at full opacity" aria-pressed="false">!</button>
      <button class="tab-close" type="button" title="close pane" aria-label="Close pane">×</button>
    </div>
    <div class="panel-body"></div>
    <div class="grip" title="drag to resize"></div>
  </div>
</template>
<script>

window.GRAPH_GENERATION = {{GRAPH_GENERATION}};
window.CONFIG_LINES = {{CONFIG_LINES}};
window.CONFIG_FILE = {{CONFIG_FILE}};
window.START_EMPTY = {{START_EMPTY}};
window.CONFIG_PROBLEMS = {{CONFIG_PROBLEMS}};
window.PANE_POSITIONS = {{PANE_POSITIONS}};
window.PANE_LABELS = {{PANE_LABELS}};
window.PANE_DOCUMENTS = {{PANE_DOCUMENTS}};

window.CONFIG_DOCS = {{CONFIG_DOCS}};

window.CONFIG_COLOURS = {{CONFIG_COLOURS}};

window.TOKEN = {{TOKEN}};

window.HARNESS_PRESENT = {{HARNESS_PRESENT}};
window.OPEN_TERMINALS = {{OPEN_TERMINALS}};
</script>
<script src="/markdown-it.min.js"></script>
<script type="module" src="/app.js"></script>
