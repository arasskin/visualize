<!doctype html>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="/style.css">
<header>
  <button id="regen" title="re-read the sources and rebuild">Regenerate</button>
  <button id="fit" title="fit to window (0)">Fit</button>
  <span id="zoom"></span>
  <span id="status"></span>
</header>
<div id="graph">{{GRAPH}}<div id="edgelabel"></div></div>

<div id="config" class="panel shut">
  <div id="bar" class="bar" title="click to open, drag to move">
    <span class="name">{{CONFIG_NAME}}</span>
  </div>
  <div id="body" class="panel-body">
    <div id="lines"></div>
    <div id="problems"></div>
  </div>
  <div id="grip" class="grip" title="drag to resize"></div>
</div>

<div id="harness" class="panel shut">
  <div id="harness-bar" class="bar" title="click to open, drag to move">
    <span class="name">{{HARNESS_NAME}}</span>
    <span id="harness-state" class="state"></span>
  </div>
  <!-- The terminal is a <pre>: the emulator writes a screen grid into it, and
       a monospace block is exactly the shape a terminal is. tabindex makes it
       focusable, which is how keystrokes get captured without a text input. -->
  <div id="harness-body" class="panel-body">
    <pre id="screen" tabindex="0" spellcheck="false"></pre>
  </div>
  <div id="harness-grip" class="grip" title="drag to resize"></div>
</div>
<script>
// The file the page was rendered from, handed over at load so the editor opens
// on the same lines the graph came from.
window.CONFIG_LINES = {{CONFIG_LINES}};
window.CONFIG_PROBLEMS = {{CONFIG_PROBLEMS}};
</script>
<script src="/app.js"></script>
